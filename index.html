<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <title>Quantrex</title>

    <!-- PWA & Mobile Web App Meta -->
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#0a0d14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Quantrex" />
    <link rel="apple-touch-icon" href="./quantrex-logo.png" />

    <style>
      /* Zero-flash dark base */
      html.dark, html.dark body {
        background-color: #0a0d14 !important;
        color: #f1f5f9;
      }
      /* Smooth touch scrolling & tap highlight */
      * {
        -webkit-tap-highlight-color: transparent;
      }
    </style>
    <script>
      (function() {
        try {
          var explicit = localStorage.getItem('quantrex_theme_explicitly_set');
          var t = localStorage.getItem('quantrex_neumorphic_theme');
          var isDark = true;
          if (explicit === 'true' && (t === '"light"' || t === 'light')) {
            isDark = false;
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
            if (document.body) document.body.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
            if (document.body) document.body.classList.remove('dark');
          }
        } catch (e) {}

        // Register PWA Service Worker
        if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('./sw.js').catch(function() {});
          });
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
